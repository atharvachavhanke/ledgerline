<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ledgerline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f1b14;
    --panel: #16241b;
    --panel-2: #1b2c20;
    --text: #edece3;
    --muted: #93a693;
    --accent: #c7a24c;
    --accent-dim: rgba(199,162,76,0.25);
    --border: rgba(199,162,76,0.16);
    --danger: #c96a4c;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
  body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  header {
    padding: env(safe-area-inset-top, 0px) 0 0 0;
    border-bottom: 1px solid var(--border);
    background: linear-gradient(180deg, var(--panel), var(--bg));
  }
  .header-inner {
    max-width: 680px;
    margin: 0 auto;
    padding: 22px 20px 16px;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .mark { flex-shrink: 0; }
  .mark svg { display: block; }
  .titles h1 {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 22px;
    margin: 0 0 2px;
    letter-spacing: 0.2px;
  }
  .titles p {
    margin: 0;
    font-size: 13px;
    color: var(--muted);
    line-height: 1.4;
  }

  main {
    flex: 1;
    max-width: 680px;
    width: 100%;
    margin: 0 auto;
    padding: 20px 20px 12px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  .empty-state {
    margin: auto 0;
    text-align: center;
    color: var(--muted);
    padding: 40px 10px;
  }
  .empty-state .stub {
    font-family: 'Fraunces', serif;
    font-size: 17px;
    color: var(--text);
    margin-bottom: 10px;
  }
  .prompts {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    margin-top: 16px;
  }
  .prompt-chip {
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--muted);
    font-size: 12.5px;
    padding: 8px 12px;
    border-radius: 3px;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    transition: border-color 0.15s ease, color 0.15s ease;
  }
  .prompt-chip:hover { border-color: var(--accent); color: var(--text); }

  .msg { display: flex; flex-direction: column; max-width: 92%; }
  .msg.user { align-self: flex-end; align-items: flex-end; }
  .msg.assistant { align-self: flex-start; align-items: flex-start; }

  .msg-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    color: var(--muted);
    margin-bottom: 6px;
    letter-spacing: 0.02em;
  }

  .bubble {
    padding: 12px 14px;
    font-size: 14.5px;
    line-height: 1.55;
    border-radius: 2px;
  }
  .msg.user .bubble {
    background: var(--panel-2);
    border-right: 2px solid var(--accent);
  }
  .msg.assistant .bubble {
    background: transparent;
    border-left: 2px solid var(--accent-dim);
    padding-left: 14px;
  }
  .bubble p { margin: 0 0 10px; }
  .bubble p:last-child { margin-bottom: 0; }
  .bubble strong { color: var(--accent); font-weight: 600; }

  .sources {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 5px;
  }
  .sources a {
    font-size: 12px;
    color: var(--muted);
    text-decoration: none;
    font-family: 'IBM Plex Mono', monospace;
  }
  .sources a:hover { color: var(--accent); }

  .searching {
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--muted);
    font-size: 13px;
    font-family: 'IBM Plex Mono', monospace;
    padding-left: 16px;
  }
  .searching .dot {
    width: 5px; height: 5px; border-radius: 50%;
    background: var(--accent);
    animation: pulse 1.1s ease-in-out infinite;
  }
  .searching .dot:nth-child(2) { animation-delay: 0.15s; }
  .searching .dot:nth-child(3) { animation-delay: 0.3s; }
  @keyframes pulse {
    0%, 60%, 100% { opacity: 0.25; }
    30% { opacity: 1; }
  }

  .error-note {
    color: var(--danger);
    font-size: 13px;
    font-family: 'IBM Plex Mono', monospace;
    padding-left: 16px;
  }

  .composer-wrap {
    border-top: 1px solid var(--border);
    background: var(--panel);
    padding: 14px 20px calc(16px + env(safe-area-inset-bottom, 0px));
  }
  .composer {
    max-width: 680px;
    margin: 0 auto;
    display: flex;
    align-items: flex-end;
    gap: 10px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 8px 8px 8px 14px;
  }
  .composer:focus-within { border-color: var(--accent); }
  textarea#input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    resize: none;
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 14.5px;
    line-height: 1.5;
    max-height: 140px;
    padding: 6px 0;
  }
  textarea#input::placeholder { color: var(--muted); }
  button#send {
    background: var(--accent);
    color: #16240f;
    border: none;
    border-radius: 2px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12.5px;
    font-weight: 500;
    padding: 10px 16px;
    cursor: pointer;
    flex-shrink: 0;
    transition: opacity 0.15s ease;
  }
  button#send:disabled { opacity: 0.4; cursor: default; }
  button#send:not(:disabled):hover { opacity: 0.88; }

  .footnote {
    max-width: 680px;
    margin: 8px auto 0;
    font-size: 11px;
    color: var(--muted);
    text-align: center;
  }

  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f7f5ee;
      --panel: #efece1;
      --panel-2: #e7e2d3;
      --text: #1c2a1e;
      --muted: #6b7a6a;
      --accent: #96702a;
      --accent-dim: rgba(150,112,42,0.25);
      --border: rgba(150,112,42,0.22);
    }
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="mark">
      <svg width="34" height="34" viewBox="0 0 34 34" fill="none">
        <path d="M3 26L11 16L17 21L31 6" stroke="#c7a24c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M23 6H31V14" stroke="#c7a24c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <div class="titles">
      <h1>Ledgerline</h1>
      <p>Ask anything on finance and growth — every answer is checked against the live web.</p>
    </div>
  </div>
</header>

<main id="chat"></main>

<div class="composer-wrap">
  <div class="composer">
    <textarea id="input" placeholder="Ask about markets, business growth, investing, the economy…" rows="1"></textarea>
    <button id="send">Ask</button>
  </div>
  <div class="footnote">Answers can be incomplete or wrong — verify anything you act on financially.</div>
</div>

<script>
const chatEl = document.getElementById('chat');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('send');

let history = [];
let busy = false;

function renderEmptyState() {
  chatEl.innerHTML = `
    <div class="empty-state">
      <div class="stub">What are you trying to figure out?</div>
      <div style="font-size:13px; max-width:380px; margin:0 auto;">Markets, a company's numbers, a growth strategy, a rate decision — ask, and I'll check the current web before answering.</div>
      <div class="prompts">
        <button class="prompt-chip" data-q="What did the Fed decide at its last meeting, and what's next?">Fed's last meeting</button>
        <button class="prompt-chip" data-q="What are good levers to grow a small e-commerce brand's revenue this quarter?">Growth levers, e-commerce</button>
        <button class="prompt-chip" data-q="What's the S&amp;P 500 done in the past month?">S&amp;P 500, past month</button>
      </div>
    </div>`;
  chatEl.querySelectorAll('.prompt-chip').forEach(btn => {
    btn.addEventListener('click', () => {
      inputEl.value = btn.dataset.q;
      sendMessage();
    });
  });
}

function escapeHtml(str) {
  return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function textToHtml(text) {
  return text
    .split(/\n{2,}/)
    .map(para => `<p>${escapeHtml(para).replace(/\n/g, '<br>')}</p>`)
    .join('');
}

function addUserMessage(text) {
  const div = document.createElement('div');
  div.className = 'msg user';
  div.innerHTML = `<div class="msg-label">you</div><div class="bubble"></div>`;
  div.querySelector('.bubble').textContent = text;
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
}

function addSearchingIndicator() {
  const div = document.createElement('div');
  div.className = 'searching';
  div.id = 'searching-indicator';
  div.innerHTML = `<span class="dot"></span><span class="dot"></span><span class="dot"></span> checking the web`;
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
  return div;
}

function addAssistantMessage(text, sources) {
  const div = document.createElement('div');
  div.className = 'msg assistant';
  let sourcesHtml = '';
  if (sources && sources.length) {
    sourcesHtml = `<div class="sources">${sources.slice(0, 5).map(s =>
      `<a href="${s.url}" target="_blank" rel="noopener">${escapeHtml(s.title || s.url)}</a>`
    ).join('')}</div>`;
  }
  div.innerHTML = `<div class="msg-label">ledgerline</div><div class="bubble">${textToHtml(text)}${sourcesHtml}</div>`;
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
}

function addErrorMessage(msg) {
  const div = document.createElement('div');
  div.className = 'error-note';
  div.textContent = msg;
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
}

async function sendMessage() {
  const text = inputEl.value.trim();
  if (!text || busy) return;

  if (chatEl.querySelector('.empty-state')) chatEl.innerHTML = '';

  addUserMessage(text);
  history.push({ role: 'user', content: text });
  inputEl.value = '';
  inputEl.style.height = 'auto';

  busy = true;
  sendBtn.disabled = true;
  const indicator = addSearchingIndicator();

  try {
    // Calls our own serverless function — the Anthropic API key never
    // touches the browser.
    const response = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: history })
    });

    const data = await response.json();
    indicator.remove();

    if (!response.ok) {
      throw new Error((data && data.error) || 'Request failed');
    }

    const blocks = data.content || [];
    let answerText = '';
    const sources = [];

    blocks.forEach(block => {
      if (block.type === 'text') {
        answerText += block.text;
      }
      if (block.type === 'web_search_tool_result' && Array.isArray(block.content)) {
        block.content.forEach(item => {
          if (item.url) sources.push({ url: item.url, title: item.title });
        });
      }
    });

    if (!answerText.trim()) answerText = "I wasn't able to put together an answer that time — try rephrasing the question.";

    addAssistantMessage(answerText, sources);
    history.push({ role: 'assistant', content: answerText });

  } catch (err) {
    indicator.remove();
    addErrorMessage('Something went wrong reaching the assistant. Try again in a moment.');
    console.error(err);
    history.pop(); // remove the unanswered user turn so retry works cleanly
  } finally {
    busy = false;
    sendBtn.disabled = false;
    inputEl.focus();
  }
}

sendBtn.addEventListener('click', sendMessage);
inputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});
inputEl.addEventListener('input', () => {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 140) + 'px';
});

renderEmptyState();
</script>
</body>
</html>
